<!DOCTYPE html>
<html lang="en" data-theme="obsidian">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagelens Studio — Apple-grade Zero-Border Capture & Privacy</title>
  <link rel="icon" type="image/png" href="src/assets/icons/icon-48.png">
  <link rel="stylesheet" href="src/studio/styles/studio.css">
  <style>
    /* Quick Switcher HUD at very top edge */
    .pagelens-environment-bar {
      height: 34px;
      background: rgba(10, 11, 14, 0.94);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-transparent);
      z-index: 1000;
      user-select: none;
    }

    .env-links {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .env-link {
      color: var(--text-muted);
      text-decoration: none;
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      transition: all var(--duration-fast) var(--ease-spring);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .env-link:hover {
      background: var(--surface-nested);
      color: var(--text-primary);
      transform: translateY(-1px);
    }

    .env-link.active {
      background: var(--accent-violet-tint);
      color: var(--accent-violet);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- System / Environment Quick Switcher -->
  <div class="pagelens-environment-bar">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span style="display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent-mint); box-shadow: 0 0 8px var(--accent-mint);"></span>
      <span style="font-weight: 600; color: var(--text-primary);">Pagelens Manifest V3</span>
      <span style="display: inline-flex; align-items: center; gap: 4px; color: var(--text-muted);">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="2"/></svg>
        Zero-Border macOS Sonoma System
      </span>
    </div>
    <div class="env-links">
      <a class="env-link active" href="index.html">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 15 3-3 3 3"/></svg>
        Studio Editor
      </a>
      <a class="env-link" href="src/popup/popup.html" target="_blank">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="12" cy="12" r="3"/></svg>
        Popup View
      </a>
      <a class="env-link" href="tests/fixtures/test-page.html" target="_blank">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        Fixture Testbench
      </a>
      <a class="env-link" href="tests/runner.html" target="_blank">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Test Suite
      </a>
    </div>
  </div>

  <div id="app-root" style="height: calc(100vh - 34px);"></div>

  <script type="module" src="src/studio/studio.js"></script>
</body>
</html>
