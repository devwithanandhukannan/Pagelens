<!DOCTYPE html>
<html lang="en" data-theme="obsidian">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pagelens Capture</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="popup-header">
      <div class="popup-brand">
        <div class="popup-icon" style="background: transparent; overflow: hidden; border-radius: 6px;">
          <img src="../assets/icons/icon-48.png" width="24" height="24" alt="Pagelens Logo" style="display: block; border-radius: 6px; width: 24px; height: 24px;">
        </div>
        <span class="popup-title">Pagelens</span>
      </div>
      <span class="pill-badge mint" style="font-size: 10px;">Ready</span>
    </div>

    <!-- Primary: Full Page Capture -->
    <button class="popup-btn primary spring-btn" id="btn-capture-full">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M12 8v8"/><path d="m8 12 4 4 4-4"/></svg>
        <span>Full Page</span>
      </div>
      <span class="shortcut-badge" id="shortcut-full">CMD+SHIFT+S</span>
    </button>

    <!-- Secondary: Visible Area -->
    <button class="popup-btn secondary spring-btn" id="btn-capture-visible">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="12" cy="12" r="3"/></svg>
        <span>Visible Area</span>
      </div>
      <span class="shortcut-badge" id="shortcut-vis">CMD+SHIFT+V</span>
    </button>

    <!-- Open Studio Direct -->
    <button class="popup-btn secondary spring-btn" id="btn-open-studio" style="height: 36px; font-size: 12px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        <span>Open Studio Editor</span>
      </div>
    </button>

    <!-- Protected Page Warning Card (Clean, non-colliding alert) -->
    <div id="popup-notice-card" class="popup-notice-card" style="display: none;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink: 0;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="popup-notice-text">Internal browser pages are protected. Switch to any regular website to capture.</span>
    </div>

    <!-- Status / Segmented Progress Card (Only shown during active capture) -->
    <div id="popup-status-area" style="display: none;" class="popup-status-card">
      <div class="popup-hud-header">
        <span class="popup-hud-title">Screen capture in progress...</span>
        <span class="popup-hud-slice" id="popup-status-text">Preparing...</span>
      </div>
      <div class="popup-hud-segments" id="popup-hud-segments">
        <span class="popup-seg-block"></span>
        <span class="popup-seg-block"></span>
        <span class="popup-seg-block"></span>
        <span class="popup-seg-block"></span>
        <span class="popup-seg-block"></span>
        <span class="popup-seg-block"></span>
        <span class="popup-seg-block"></span>
        <span class="popup-seg-block"></span>
        <span class="popup-seg-block"></span>
        <span class="popup-seg-block"></span>
        <span class="popup-seg-block"></span>
        <span class="popup-seg-block"></span>
        <span class="popup-seg-block"></span>
        <span class="popup-seg-block"></span>
        <span class="popup-seg-block"></span>
        <span class="popup-seg-block"></span>
      </div>
    </div>

    <!-- Minimal Footer -->
    <div class="popup-footer" style="justify-content: flex-end;">
      <a class="quiet-link" id="link-options">Settings</a>
    </div>
  </div>

  <script type="module" src="./popup-view.js"></script>
</body>
</html>
